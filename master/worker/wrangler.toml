# KGM 자비스 중계 서버 — Cloudflare Worker 설정
# wrangler CLI로 배포할 때 쓰는 파일 (대시보드로 배포하면 없어도 됨).
#
# CLI 배포 순서:
#   1) npm install -g wrangler
#   2) wrangler login
#   3) wrangler secret put ANTHROPIC_API_KEY   ← 키 입력 (코드·깃에 안 남음)
#   4) wrangler deploy

name = "kgm-jarvis"
main = "worker.js"
compatibility_date = "2025-09-01"
