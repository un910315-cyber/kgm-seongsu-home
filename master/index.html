<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>KGM 자비스</title>
<meta name="description" content="KGM 성수서비스센터 음성 비서">

<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0a0a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="자비스">
<link rel="apple-touch-icon" href="icons/icon.svg">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">

<style>
  :root {
    --bg: #0a0a0a;
    --panel: #141417;
    --line: rgba(255,255,255,.08);
    --text: #f3f4f6;
    --dim: #9aa0aa;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    overflow: hidden;
  }
  button { font-family: inherit; cursor: pointer; }

  /* ───── 로그인 화면 ───── */
  #loginScreen {
    position: fixed; inset: 0; z-index: 50;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 22px; padding: 32px;
    background: radial-gradient(ellipse at 50% 38%, #15203a 0%, #0a0a0a 62%);
  }
  #loginScreen .li-orb {
    width: 96px; height: 96px; border-radius: 50%;
    background: radial-gradient(circle at 40% 34%, #fff, #4b9cff 58%, #1e3a8a 100%);
    box-shadow: 0 0 50px 8px #4b9cff, 0 0 110px 26px rgba(75,156,255,.35);
    animation: breathe 4s ease-in-out infinite;
  }
  #loginScreen h1 { margin: 6px 0 0; font-size: 22px; font-weight: 800; letter-spacing: .5px; }
  #loginScreen p { margin: 0; color: var(--dim); font-size: 13px; text-align: center; line-height: 1.6; }
  #googleLoginBtn {
    display: flex; align-items: center; gap: 10px;
    background: #fff; color: #1f2937;
    border: 0; border-radius: 12px;
    padding: 13px 22px; font-size: 15px; font-weight: 700;
  }
  #googleLoginBtn:active { transform: scale(.97); }
  #loginError { color: #f87171; font-size: 12px; min-height: 14px; text-align: center; }

  /* ───── 메인 ───── */
  #app { display: none; flex-direction: column; height: 100dvh; }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: calc(12px + env(safe-area-inset-top)) 18px 12px;
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }
  header .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; letter-spacing: .5px; }
  header .brand .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: #4b9cff; box-shadow: 0 0 10px 2px #4b9cff;
  }
  header .who { font-size: 11px; color: var(--dim); }
  #logoutBtn {
    background: transparent; color: var(--dim);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 11px; font-size: 11px; font-weight: 600;
  }

  /* 오브 */
  .orb-stage { flex-shrink: 0; display: grid; place-items: center; padding: 26px 0 14px; }
  .orb {
    position: relative; width: 160px; height: 160px;
    display: grid; place-items: center;
    --c: #7fb3ff; --level: 0;
  }
  .orb-core {
    width: 92px; height: 92px; border-radius: 50%;
    background: radial-gradient(circle at 38% 32%, #ffffff 0%, var(--c) 56%, rgba(0,0,0,0) 80%);
    box-shadow: 0 0 56px 8px var(--c), 0 0 120px 30px var(--c);
    transition: background .45s ease, box-shadow .45s ease;
    transform: scale(calc(1 + var(--level) * 0.45));
  }
  .orb-ring {
    position: absolute; border-radius: 50%;
    border: 2px solid var(--c);
    opacity: 0; transition: opacity .4s ease;
  }
  .orb-ring.r1 { inset: 18px; }
  .orb-ring.r2 { inset: 2px; }

  /* 상태별 */
  .orb.idle { --c: #7fb3ff; }
  .orb.idle .orb-core { animation: breathe 4.2s ease-in-out infinite; }
  .orb.listening { --c: #4b9cff; }
  .orb.listening .orb-ring { opacity: .5; animation: ripple 1.6s ease-out infinite; }
  .orb.listening .orb-ring.r2 { animation-delay: .8s; }
  .orb.thinking { --c: #a78bfa; }
  .orb.thinking .orb-core { animation: breathe 1s ease-in-out infinite; }
  .orb.thinking .orb-ring.r1 { opacity: .7; border-style: dashed; animation: spin 2.4s linear infinite; }
  .orb.speaking { --c: #34d399; }
  .orb.speaking .orb-core { animation: talk .5s ease-in-out infinite; }
  .orb.speaking .orb-ring { opacity: .45; animation: ripple 1.1s ease-out infinite; }
  .orb.speaking .orb-ring.r2 { animation-delay: .55s; }

  @keyframes breathe { 0%,100%{transform:scale(.92);} 50%{transform:scale(1.05);} }
  @keyframes talk    { 0%,100%{transform:scale(.96);} 50%{transform:scale(1.12);} }
  @keyframes ripple  { 0%{transform:scale(.7);opacity:.6;} 100%{transform:scale(1.35);opacity:0;} }
  @keyframes spin    { to{transform:rotate(360deg);} }

  #status {
    flex-shrink: 0; text-align: center;
    font-size: 13px; color: var(--dim);
    padding: 0 24px 6px; min-height: 20px; line-height: 1.5;
  }

  /* 대화 */
  #transcript {
    flex: 1; overflow-y: auto;
    padding: 10px 16px 16px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .bubble {
    max-width: 84%; padding: 11px 14px;
    font-size: 14px; line-height: 1.62; border-radius: 14px;
    white-space: pre-wrap; word-break: break-word;
  }
  .bubble.me {
    align-self: flex-end;
    background: #2563eb; color: #fff;
    border-bottom-right-radius: 4px;
  }
  .bubble.jv {
    align-self: flex-start;
    background: var(--panel); border: 1px solid var(--line);
    border-bottom-left-radius: 4px;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; padding: 2px 0 4px; }
  .chip {
    background: rgba(75,156,255,.1); color: #9ec8ff;
    border: 1px solid rgba(75,156,255,.28); border-radius: 999px;
    padding: 7px 13px; font-size: 12px; font-weight: 600;
  }
  .chip:active { transform: scale(.95); }

  /* 입력 바 */
  #inputBar {
    flex-shrink: 0;
    display: flex; align-items: center; gap: 9px;
    padding: 10px 14px calc(12px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line);
    background: var(--bg);
  }
  #textInput {
    flex: 1; min-width: 0;
    background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px; font-size: 15px; outline: none;
  }
  #textInput:focus { border-color: rgba(75,156,255,.5); }
  #sendBtn, #micBtn {
    flex-shrink: 0; border: 0; border-radius: 50%;
    display: grid; place-items: center;
  }
  #sendBtn {
    width: 44px; height: 44px;
    background: var(--panel); border: 1px solid var(--line);
    color: var(--dim); font-size: 17px;
  }
  #micBtn {
    width: 56px; height: 56px;
    background: #2563eb; color: #fff; font-size: 24px;
    box-shadow: 0 0 0 0 rgba(37,99,235,.5);
    transition: transform .15s ease;
  }
  #micBtn:active { transform: scale(.92); }
  #micBtn.live {
    background: #4b9cff;
    animation: micpulse 1.4s ease-out infinite;
  }
  #micBtn[disabled] { opacity: .35; }
  @keyframes micpulse {
    0%   { box-shadow: 0 0 0 0 rgba(75,156,255,.55); }
    100% { box-shadow: 0 0 0 18px rgba(75,156,255,0); }
  }
</style>
</head>
<body>

  <!-- 로그인 -->
  <div id="loginScreen">
    <div class="li-orb"></div>
    <div style="text-align:center;">
      <h1>KGM 자비스</h1>
      <p style="margin-top:6px;">성수서비스센터 음성 비서</p>
    </div>
    <button id="googleLoginBtn">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.9 2.4 30.4 0 24 0 14.6 0 6.4 5.4 2.5 13.2l7.9 6.1C12.3 13.2 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.1 5.3-4.6 7l7.2 5.6c4.2-3.9 6.6-9.6 6.6-16.6z"/><path fill="#FBBC05" d="M10.4 28.3c-.5-1.4-.7-2.9-.7-4.3s.3-2.9.7-4.3l-7.9-6.1C.9 16.7 0 20.2 0 24s.9 7.3 2.5 10.4l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.2-5.6c-2 1.4-4.6 2.2-8.7 2.2-6.3 0-11.7-3.7-13.6-9.8l-7.9 6.1C6.4 42.6 14.6 48 24 48z"/></svg>
      Google 계정으로 시작
    </button>
    <div id="loginError"></div>
  </div>

  <!-- 메인 -->
  <div id="app">
    <header>
      <div class="brand"><span class="dot"></span><span>자비스</span></div>
      <span class="who" id="whoText"></span>
      <button id="logoutBtn">로그아웃</button>
    </header>

    <div class="orb-stage">
      <div class="orb idle" id="orb">
        <div class="orb-ring r2"></div>
        <div class="orb-ring r1"></div>
        <div class="orb-core"></div>
      </div>
    </div>

    <div id="status">불러오는 중…</div>

    <div id="transcript"></div>

    <div id="inputBar">
      <input id="textInput" type="text" placeholder="질문을 입력하거나 마이크를 누르세요" autocomplete="off" enterkeyhint="send">
      <button id="sendBtn" aria-label="보내기">➤</button>
      <button id="micBtn" aria-label="음성 입력">🎤</button>
    </div>
  </div>

  <script type="module" src="app.js?v=v1-2026-05-20"></script>
</body>
</html>
