<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>KGM 자비스</title>
<meta name="description" content="KGM 성수서비스센터 음성 비서">

<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="자비스">
<link rel="apple-touch-icon" href="icons/icon.svg">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">

<style>
  :root {
    --panel: #141417;
    --line: rgba(255,255,255,.09);
    --text: #f3f4f6;
    --dim: #8a8f99;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #000;
    color: var(--text);
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    overflow: hidden;
  }
  button { font-family: inherit; cursor: pointer; }

  /* ───── 로그인 ───── */
  #loginScreen {
    position: fixed; inset: 0; z-index: 50;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 22px; padding: 32px;
    background: radial-gradient(ellipse at 50% 38%, #0e1626 0%, #000 64%);
  }
  #loginScreen .li-orb {
    width: 96px; height: 96px; border-radius: 50%;
    background: radial-gradient(circle at 42% 36%, #fff, #00cfff 55%, #0069aa 100%);
    box-shadow: 0 0 50px 8px #00cfff, 0 0 120px 30px rgba(0,207,255,.35);
    animation: jxBreathe 4s ease-in-out infinite;
  }
  #loginScreen h1 { margin: 6px 0 0; font-size: 22px; font-weight: 800; letter-spacing: 1px; }
  #loginScreen p { margin: 0; color: var(--dim); font-size: 13px; text-align: center; }
  #googleLoginBtn {
    display: flex; align-items: center; gap: 10px;
    background: #fff; color: #1f2937; border: 0; border-radius: 12px;
    padding: 13px 22px; font-size: 15px; font-weight: 700;
  }
  #googleLoginBtn:active { transform: scale(.97); }
  #loginError { color: #f87171; font-size: 12px; min-height: 14px; text-align: center; }

  /* ───── 메인 — 시네마틱 ───── */
  #app { display: none; flex-direction: column; height: 100dvh; position: relative; }

  /* 상단 — 최소한의 조작만, 평소엔 흐릿 */
  .topbar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 5;
    display: flex; justify-content: space-between;
    padding: calc(10px + env(safe-area-inset-top)) 16px 0;
  }
  .topbar button {
    background: transparent; color: var(--dim);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 10px; font-size: 11px; font-weight: 600;
    opacity: .4; transition: opacity .25s ease;
  }
  .topbar button:active { opacity: 1; }
  #settingsBtn { font-size: 13px; padding: 6px 9px; }

  /* 무대 — 자비스가 사는 곳 */
  .stage {
    flex: 1; min-height: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 20px; padding: 24px;
    background: radial-gradient(ellipse 62% 42% at 50% 44%, rgba(75,156,255,.08), transparent 72%);
  }

  /* 자막 */
  .cap-you, .cap-jv {
    text-align: center; max-width: 600px;
    opacity: 0; transform: translateY(9px);
    transition: opacity .55s ease, transform .55s ease;
  }
  .cap-you.show, .cap-jv.show { opacity: 1; transform: none; }
  .cap-you {
    font-size: 13px; color: #5f6671;
    letter-spacing: .6px; min-height: 18px;
  }
  .cap-jv {
    font-size: 16.5px; line-height: 1.72; color: #e9ebef;
    font-weight: 500; white-space: pre-wrap; word-break: break-word;
    max-height: 32vh; overflow-y: auto;
    padding: 0 4px;
  }

  /* 오브 = 자비스 본체 (탭하면 듣기) — 자비스 코어 애니메이션 */
  .orb {
    position: relative;
    width: min(64vw, 230px);
    aspect-ratio: 1 / 1;
    display: flex; align-items: center; justify-content: center;
    background: transparent; border: 0; padding: 0;
    --level: 0;
    filter: drop-shadow(0 0 28px rgba(0,180,255,.35));
  }
  .jx-core {
    position: relative; width: 70%; aspect-ratio: 1 / 1; border-radius: 50%;
    background:
      radial-gradient(circle, rgba(0,180,255,.95) 0%, rgba(0,120,210,.35) 18%, rgba(0,0,0,.1) 34%, transparent 45%),
      repeating-conic-gradient(from 0deg, rgba(0,220,255,.9) 0deg 3deg, transparent 3deg 8deg);
    box-shadow: 0 0 18px rgba(0,200,255,.9), 0 0 55px rgba(0,150,255,.55), inset 0 0 60px rgba(0,210,255,.45);
    animation: jxPulse 3s ease-in-out infinite;
  }
  .jx-ring {
    position: absolute; inset: 0; border-radius: 50%;
    border: 2px solid rgba(0,210,255,.45);
    box-shadow: 0 0 18px rgba(0,180,255,.45), inset 0 0 22px rgba(0,180,255,.3);
  }
  .jx-ring.one   { inset: 4%;  border-style: dashed; animation: jxRotate 10s linear infinite; }
  .jx-ring.two   { inset: 13%; border-width: 8px; border-color: rgba(0,210,255,.22); animation: jxRotateRev 14s linear infinite; }
  .jx-ring.three { inset: 24%; border-style: dotted; animation: jxRotate 6s linear infinite; }
  .jx-segments {
    position: absolute; inset: -7%; border-radius: 50%;
    background: repeating-conic-gradient(from 0deg,
      rgba(0,220,255,.85) 0deg 1.4deg, transparent 1.4deg 5.5deg,
      rgba(0,130,255,.35) 5.5deg 7deg, transparent 7deg 12deg);
    -webkit-mask: radial-gradient(circle, transparent 0 53%, #000 54% 61%, transparent 62%);
    mask: radial-gradient(circle, transparent 0 53%, #000 54% 61%, transparent 62%);
    animation: jxRotate 18s linear infinite;
  }
  .jx-mechanic {
    position: absolute; inset: 18%; border-radius: 50%;
    background: repeating-conic-gradient(rgba(0,200,255,.7) 0deg 6deg, transparent 6deg 18deg);
    -webkit-mask: radial-gradient(circle, transparent 0 64%, #000 65% 72%, transparent 73%);
    mask: radial-gradient(circle, transparent 0 64%, #000 65% 72%, transparent 73%);
    animation: jxRotateRev 8s linear infinite;
  }
  .jx-center {
    position: absolute; width: 30%; aspect-ratio: 1 / 1; border-radius: 50%;
    background: radial-gradient(circle, #00cfff 0%, #0069aa 42%, #001625 76%);
    box-shadow: 0 0 28px rgba(0,220,255,.95), inset 0 0 35px rgba(255,255,255,.25);
    animation: jxBreathe 2.6s ease-in-out infinite;
  }
  .jx-wave {
    position: absolute; width: 36%; aspect-ratio: 1 / 1; border-radius: 50%;
    border: 2px solid rgba(0,220,255,.6); opacity: 0;
  }

  /* 듣는 중 — 마이크 음량에 가운데가 반응 */
  .orb.listening .jx-center {
    animation: none;
    transform: scale(calc(1 + var(--level) * 0.6));
    transition: transform .08s linear;
  }
  /* 생각 중 — 링·코어 회전 가속 */
  .orb.thinking .jx-ring.one   { animation-duration: 3s; }
  .orb.thinking .jx-ring.three { animation-duration: 2s; }
  .orb.thinking .jx-mechanic   { animation-duration: 3s; }
  .orb.thinking .jx-core       { animation-duration: 1s; }
  /* 말하는 중 — 파동 + 코어/센터 강조 */
  .orb.speaking .jx-wave.a { animation: jxTalkWave 1.3s ease-out infinite; }
  .orb.speaking .jx-wave.b { animation: jxTalkWave 1.3s ease-out infinite .35s; }
  .orb.speaking .jx-wave.c { animation: jxTalkWave 1.3s ease-out infinite .7s; }
  .orb.speaking .jx-center { animation: jxSpeakPulse .42s ease-in-out infinite alternate; }
  .orb.speaking .jx-core   { animation: jxSpeakGlow .55s ease-in-out infinite alternate; }

  @keyframes jxRotate    { to { transform: rotate(360deg); } }
  @keyframes jxRotateRev { to { transform: rotate(-360deg); } }
  @keyframes jxPulse     { 0%,100%{transform:scale(1);opacity:.9;} 50%{transform:scale(1.025);opacity:1;} }
  @keyframes jxBreathe   { 0%,100%{transform:scale(1);} 50%{transform:scale(1.08);} }
  @keyframes jxSpeakPulse { from{transform:scale(.9);box-shadow:0 0 22px rgba(0,220,255,.75);} to{transform:scale(1.22);box-shadow:0 0 60px rgba(0,240,255,1);} }
  @keyframes jxSpeakGlow  { from{filter:brightness(1);transform:scale(1);} to{filter:brightness(1.55);transform:scale(1.035);} }
  @keyframes jxTalkWave   { 0%{transform:scale(.8);opacity:.75;} 100%{transform:scale(2.15);opacity:0;} }

  #hint {
    text-align: center; font-size: 12px; color: #585e68;
    min-height: 16px; letter-spacing: .3px; padding: 0 24px;
  }

  /* 하단 — 키보드 입력(보조) */
  .dock {
    flex-shrink: 0;
    display: flex; align-items: center; gap: 8px; justify-content: center;
    padding: 10px 16px calc(14px + env(safe-area-inset-bottom));
  }
  #kbToggle {
    width: 42px; height: 38px; flex-shrink: 0;
    background: transparent; color: var(--dim);
    border: 1px solid var(--line); border-radius: 11px;
    font-size: 16px; opacity: .5;
  }
  #kbToggle.on { opacity: 1; color: #9ec8ff; border-color: rgba(75,156,255,.4); }
  #inputWrap { display: flex; gap: 8px; flex: 1; }
  #inputWrap[hidden] { display: none; }
  #textInput {
    flex: 1; min-width: 0;
    background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 11px;
    padding: 11px 13px; font-size: 15px; outline: none;
  }
  #textInput:focus { border-color: rgba(75,156,255,.5); }
  #sendBtn {
    flex-shrink: 0; width: 42px; height: 42px;
    border: 1px solid var(--line); border-radius: 11px;
    background: var(--panel); color: var(--dim); font-size: 15px;
  }

  /* ───── 음성 설정 시트 ───── */
  #settingsModal {
    position: fixed; inset: 0; z-index: 60;
    display: flex; align-items: flex-end; justify-content: center;
    background: rgba(0,0,0,.66);
  }
  #settingsModal[hidden] { display: none; }
  #settingsModal .sheet {
    width: 100%; max-width: 440px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px 18px 0 0;
    padding: 18px 20px calc(22px + env(safe-area-inset-bottom));
    animation: sheetup .22s ease;
  }
  @keyframes sheetup { from { transform: translateY(40px); opacity: 0; } }
  .sheet-head {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 16px; font-weight: 800; margin-bottom: 14px;
  }
  .sheet-head button { background: transparent; border: 0; color: var(--dim); font-size: 17px; }
  .set-label {
    display: block; font-size: 12px; color: var(--dim);
    margin: 14px 0 6px; font-weight: 600;
  }
  .set-label b { color: #9ec8ff; font-weight: 800; }
  #voiceSelect {
    width: 100%; background: #000; color: var(--text);
    border: 1px solid var(--line); border-radius: 10px;
    padding: 11px 12px; font-size: 14px; outline: none;
  }
  .set-hint { margin: 6px 0 0; font-size: 11px; color: var(--dim); line-height: 1.5; }
  input[type=range] { width: 100%; accent-color: #4b9cff; height: 26px; }
  .set-test {
    width: 100%; margin-top: 18px;
    background: rgba(75,156,255,.12); color: #9ec8ff;
    border: 1px solid rgba(75,156,255,.32); border-radius: 12px;
    padding: 13px; font-size: 14px; font-weight: 700;
  }
  .set-test:active { transform: scale(.98); }
</style>
</head>
<body>

  <!-- 로그인 -->
  <div id="loginScreen">
    <div class="li-orb"></div>
    <div style="text-align:center;">
      <h1>KGM 자비스</h1>
      <p style="margin-top:6px;">성수서비스센터 음성 비서</p>
    </div>
    <button id="googleLoginBtn">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.9 2.4 30.4 0 24 0 14.6 0 6.4 5.4 2.5 13.2l7.9 6.1C12.3 13.2 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.1 5.3-4.6 7l7.2 5.6c4.2-3.9 6.6-9.6 6.6-16.6z"/><path fill="#FBBC05" d="M10.4 28.3c-.5-1.4-.7-2.9-.7-4.3s.3-2.9.7-4.3l-7.9-6.1C.9 16.7 0 20.2 0 24s.9 7.3 2.5 10.4l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.2-5.6c-2 1.4-4.6 2.2-8.7 2.2-6.3 0-11.7-3.7-13.6-9.8l-7.9 6.1C6.4 42.6 14.6 48 24 48z"/></svg>
      Google 계정으로 시작
    </button>
    <div id="loginError"></div>
  </div>

  <!-- 메인 -->
  <div id="app">
    <div class="topbar">
      <button id="settingsBtn" aria-label="음성 설정">⚙</button>
      <button id="logoutBtn">로그아웃</button>
    </div>

    <div class="stage">
      <div id="capYou" class="cap-you"></div>

      <button class="orb idle" id="orb" aria-label="탭하고 말하기">
        <div class="jx-segments"></div>
        <div class="jx-mechanic"></div>
        <div class="jx-core"></div>
        <div class="jx-ring one"></div>
        <div class="jx-ring two"></div>
        <div class="jx-ring three"></div>
        <div class="jx-wave a"></div>
        <div class="jx-wave b"></div>
        <div class="jx-wave c"></div>
        <div class="jx-center"></div>
      </button>

      <div id="capJv" class="cap-jv"></div>
      <div id="hint"></div>
    </div>

    <div class="dock">
      <div id="inputWrap" hidden>
        <input id="textInput" type="text" placeholder="질문을 입력하세요" autocomplete="off" enterkeyhint="send">
        <button id="sendBtn" aria-label="보내기">➤</button>
      </div>
      <button id="kbToggle" aria-label="키보드 입력">⌨</button>
    </div>
  </div>

  <!-- 음성 설정 -->
  <div id="settingsModal" hidden>
    <div class="sheet">
      <div class="sheet-head">
        <span>음성 설정</span>
        <button id="settingsClose" aria-label="닫기">✕</button>
      </div>
      <label class="set-label">목소리</label>
      <select id="voiceSelect"></select>
      <p class="set-hint" id="voiceHint"></p>

      <label class="set-label">말하기 속도 <b id="rateVal">1.00</b></label>
      <input type="range" id="rateRange" min="0.6" max="1.4" step="0.05" value="1">

      <label class="set-label">목소리 높낮이 <b id="pitchVal">1.00</b></label>
      <input type="range" id="pitchRange" min="0.6" max="1.4" step="0.05" value="1">

      <button id="voiceTestBtn" class="set-test">🔊 미리듣기</button>
    </div>
  </div>

  <script type="module" src="app.js?v=v4-2026-05-20"></script>
</body>
</html>
