<!-- MATRIX BG -->
<canvas id="matrixBg" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.12"></canvas>
<script>
(function(){
  var c=document.getElementById('matrixBg'),ctx=c.getContext('2d');
  var chars='0123456789ABCDEF媛?섎떎?쇰쭏諛붿궗?꾩옄李⑥뭅??뚰븯KGM쨌?섃뿦';
  var fontSize=13,columns,drops;
  function init(){
    c.width=window.innerWidth;c.height=window.innerHeight;
    columns=Math.floor(c.width/fontSize);
    drops=[];for(var i=0;i<columns;i++)drops[i]=Math.random()*-100;
  }
  init();
  window.addEventListener('resize',init);
  function draw(){
    ctx.fillStyle='rgba(10,10,10,.06)';
    ctx.fillRect(0,0,c.width,c.height);
    ctx.font=fontSize+'px JetBrains Mono,monospace';
    for(var i=0;i<columns;i++){
      var ch=chars[Math.floor(Math.random()*chars.length)];
      var y=drops[i]*fontSize;
      // 蹂대씪??洹몃씪?곗씠??(??諛앹쓬, ?꾨옒=?대몢?)
      var alpha=Math.max(0,1-drops[i]/60);
      if(Math.random()>.97) ctx.fillStyle='rgba(139,92,246,'+(.8*alpha)+')'; // 諛앹? 蹂대씪
      else if(Math.random()>.5) ctx.fillStyle='rgba(109,40,217,'+(.4*alpha)+')'; // 以묎컙 蹂대씪
      else ctx.fillStyle='rgba(79,30,180,'+(.25*alpha)+')'; // ?대몢??蹂대씪
      ctx.fillText(ch,i*fontSize,y);
      if(y>c.height&&Math.random()>.975) drops[i]=0;
      drops[i]+=.5+Math.random()*.5;
    }
  }
  window._matrixTimer=setInterval(draw,50);
})();
</script>
